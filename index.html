/* the shifts that hand over to / from this one on the same client: prev ends exactly when
   this starts, next starts exactly when this ends (works across midnight via shift dates) */
function rosterNeighbours(s){
  var st = shiftStartDate(s).getTime(), en = shiftEndDate(s).getTime();
  var prev = null, next = null;
  state.data.shifts.forEach(function(o){
    if (o.id === s.id || o.client_id !== s.client_id) return;
    if (shiftEndDate(o).getTime() === st) prev = o;
    if (shiftStartDate(o).getTime() === en) next = o;
  });
  return { prev: prev, next: next };
}
function openEditRoster(s){
  var c = clientById(s.client_id);
  var splitSel = el('select', { 'class': 'sel' }, [el('option', { value: '' }, 'Needs cover (assign later)')].concat(
    state.data.workers.filter(function(w){ return w.active && !w.is_admin && w.id !== s.worker_id; }).map(function(w){
      var busyThatDay = state.data.shifts.some(function(o){ return o.worker_id === w.id && o.date === s.date; });
      return el('option', { value: w.id }, w.name + (busyThatDay ? ' · already rostered that day' : ''));
    })));
  var m = el('div', { 'class': 'modal', style: 'max-width:420px' }, [
    el('div', { 'class': 'sheet-grab' }),
    el('div', { 'class': 'modal-head' }, [
      el('div', { 'class': 't-title' }, 'Edit shift'),
      el('button', { 'class': 'iconbtn', 'aria-label': 'Close', onclick: closeModal }, svgIcon(IC.x))
    ]),
    el('div', { 'class': 'modal-body' }, [
      el('p', { 'class': 't-mut', style: 'font-size:14px;margin-bottom:14px' }, (c ? c.name : '') + ' · ' + fmtDate(s.date) + ' · ' + fmtRange(s.start_t, s.end_t)),
      el('div', { 'class': 't-label', style: 'margin-bottom:8px' }, 'Date & times'),
      el('div', { 'class': 'field' }, [
        el('label', null, 'Date'),
        el('input', { 'class': 'inp', type: 'date', id: 'es-date', value: s.date })
      ]),
      el('div', { 'class': 'grid2' }, [
        el('div', { 'class': 'field' }, [ el('label', null, 'Start'), el('input', { 'class': 'inp', type: 'time', id: 'es-start', value: s.start_t }) ]),
        el('div', { 'class': 'field' }, [ el('label', null, 'End'), el('input', { 'class': 'inp', type: 'time', id: 'es-end', value: s.end_t }) ])
      ]),
      el('p', { 'class': 'hint', style: 'margin:-8px 0 12px' }, 'Handover rule: the shift before this one finishes when this one starts, and the shift after starts when this one finishes. Changing a time moves the neighbouring shift on this participant to match.'),
      el('button', { 'class': 'btn btn-pri btn-block', style: 'margin-bottom:16px', onclick: function(e){
        var nd = document.getElementById('es-date').value;
        var ns = document.getElementById('es-start').value;
        var ne = document.getElementById('es-end').value;
        if (!nd || !ns || !ne) { toast('Fill in the date and both times.', true); return; }
        busyBtn(e.currentTarget, true);
        var nb = nd === s.date ? rosterNeighbours(s) : { prev: null, next: null };
        var linked = [];
        if (nb.prev && ns !== s.start_t) linked.push({ sh: nb.prev, patch: { end_t: ns }, msg: (workerById(nb.prev.worker_id) || { name: 'the previous shift' }).name + ' now finishes ' + fmtTime(ns) });
        if (nb.next && ne !== s.end_t) linked.push({ sh: nb.next, patch: { start_t: ne }, msg: (workerById(nb.next.worker_id) || { name: 'the next shift' }).name + ' now starts ' + fmtTime(ne) });
        function done(){ closeModal(); toast('Shift updated to ' + fmtDate(nd) + ' · ' + fmtRange(ns, ne) + (linked.length ? ' · ' + linked.map(function(l){ return l.msg; }).join(', ') : '')); refresh(); }
        /* one transaction in the database when the RPC exists; otherwise step by step, reporting exactly what saved */
        sbRpc('ac_set_shift_times', { p_shift: s.id, p_date: nd, p_start: ns, p_end: ne })
          .then(done)
          ["catch"](function(err){
            if (!/PGRST202|Could not find the function|404/.test(err.message || '')) { busyBtn(e.target, false); toast(err.message, true); return; }
            var saved = [];
            sbUpd('ac_shifts', 'id=eq.' + s.id, { date: nd, start_t: ns, end_t: ne })
              .then(function(){ saved.push('this shift'); var chain = Promise.resolve();
                linked.forEach(function(l){ chain = chain.then(function(){ return sbUpd('ac_shifts', 'id=eq.' + l.sh.id, l.patch).then(function(){ saved.push(l.msg); }); }); });
                return chain; })
              .then(done)
              ["catch"](function(err2){
                busyBtn(e.target, false);
                var missing = linked.filter(function(l){ return saved.indexOf(l.msg) < 0; }).map(function(l){ return fmtDate(l.sh.date) + ' ' + fmtRange(l.sh.start_t, l.sh.end_t); });
                toast('PARTLY saved: ' + (saved.length ? saved.join(', ') : 'nothing') + '. NOT saved: ' + (saved.indexOf('this shift') < 0 ? 'this shift' : missing.join(', ')) + '. Fix the remaining shift by hand. (' + err2.message + ')', true);
                refresh();
              });
          });
      } }, 'Save date & times'),
      ('two_to_one' in s) ? el('label', { 'class': 'checkrow', style: 'margin:-6px 0 14px' }, [
        el('input', { type: 'checkbox', checked: !!s.two_to_one, onchange: function(ev){
          var on = ev.target.checked;
          sbUpd('ac_shifts', 'id=eq.' + s.id, { two_to_one: on })
            .then(function(){ s.two_to_one = on; toast(on ? 'Marked as 2:1 — a second worker is rostered on purpose' : '2:1 mark removed'); refresh(); })
            ["catch"](function(err){ ev.target.checked = !on; toast(err.message, true); });
        } }),
        el('div', null, [ el('b', { style: 'font-size:14px' }, '2:1 support — a second worker is rostered at the same time on purpose'), el('div', { 'class': 't-cap' }, 'Leave unticked for a handover or a split; the roster then shows an unexpected overlap as a clash.') ])
      ]) : null,
      el('div', { 'class': 'hint', style: 'margin:-10px 0 16px' }, 'Handover rule: changing the start or end also moves the shift before or after it on this client, so the two always meet at the same time.'),
      el('div', { 'class': 't-label', style: 'margin-bottom:8px' }, 'Share with a second worker'),
      el('p', { 'class': 't-mut', style: 'font-size:13px;margin-bottom:10px' }, 'Splits this shift in two. The current worker keeps the first part and the second worker takes over from the time you pick. Each part gets its own clock in/out and note.'),
      el('div', { 'class': 'grid2' }, [
        el('div', { 'class': 'field' }, [ el('label', null, 'Second worker starts'), el('input', { 'class': 'inp', type: 'time', id: 'es-split' }) ]),
        el('div', { 'class': 'field' }, [ el('label', null, 'Second worker'), splitSel ])
      ]),
      el('button', { 'class': 'btn btn-sec btn-block', style: 'margin-bottom:16px', onclick: function(e){
        var split = document.getElementById('es-split').value;
        if (!split) { toast('Pick the time the second worker starts.', true); return; }
        var st = tMin(s.start_t), en = tMin(s.end_t), sp = tMin(split);
        var inside = en <= st ? (sp > st || sp < en) : (sp > st && sp < en);   // sleepovers cross midnight
        if (!inside) { toast('That time is not inside this shift (' + fmtRange(s.start_t, s.end_t) + ').', true); return; }
        var origEnd = s.end_t, wid = splitSel.value || null, btn = e.currentTarget;
        function doSplit(){
          busyBtn(btn, true);
          function ok(){ closeModal(); toast('Shift split at ' + fmtTime(split) + (wid ? '' : ' — second part needs cover')); refresh(); }
          sbRpc('ac_split_shift', { p_shift: s.id, p_split: split, p_worker: wid })
            .then(ok)
            ["catch"](function(err){
              if (!/PGRST202|Could not find the function|404/.test(err.message || '')) { busyBtn(btn, false); toast(err.message, true); return; }
              var firstDone = false;
              sbUpd('ac_shifts', 'id=eq.' + s.id, { end_t: split })
                .then(function(){ firstDone = true; return sbIns('ac_shifts', [{ client_id: s.client_id, req_id: s.req_id, date: s.date, start_t: split, end_t: origEnd, type: s.type, worker_id: wid }]); })
                .then(ok)
                ["catch"](function(err2){
                  busyBtn(btn, false);
                  toast(firstDone ? 'PARTLY saved: the first part now ends ' + fmtTime(split) + ' but the second part (' + fmtTime(split) + '–' + fmtTime(origEnd) + ') was NOT created — add it from the roster or set the end time back. (' + err2.message + ')' : 'Nothing was changed: ' + err2.message, true);
                  refresh();
                });
            });
        }
        var w2 = wid ? workerById(wid) : null;
        if (w2 && doubleBooked(w2, { id: null, date: s.date, start_t: split, end_t: origEnd }))
          confirmDlg('Double booking', w2.name + ' already has an overlapping shift then. Split anyway?', 'Split anyway', doSplit, true);
        else doSplit();
      } }, 'Split shift'),
      el('div', { 'class': 't-label', style: 'margin-bottom:8px' }, 'Worker'),
      el('div', { style: 'display:flex;flex-direction:column;gap:8px' }, [
        el('button', { 'class': 'btn btn-sec btn-block', onclick: function(){ closeModal(); openAssign(s); } }, 'Reassign to someone else'),
        s.worker_id ? el('button', { 'class': 'btn btn-sec btn-block', onclick: function(){
          sbUpd('ac_shifts', 'id=eq.' + s.id, { worker_id: null }).then(function(){ closeModal(); toast('Worker removed — the slot now needs cover'); refresh(); })["catch"](function(e){ toast(e.message, true); });
        } }, 'Remove the worker (needs cover)') : null,
        el('button', { 'class': 'btn btn-danger btn-block', onclick: function(){
          confirmDlg('Delete this shift?', 'It disappears from the roster and calendars.', 'Delete shift', function(){
            sbDel('ac_shifts', 'id=eq.' + s.id).then(function(){ closeModal(); toast('Shift deleted'); refresh(); })["catch"](function(e){ toast(e.message, true); });
          }, true);
        } }, 'Delete this shift')
      ])
    ])
  ]);
  openModal(m);
}

/* ---------- fix / add clock records ---------- */
function openClockEdit(s, rec, kind){
  function dtLocalVal(d){ return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()) + 'T' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()); }
  var def = rec ? dtLocalVal(new Date(rec.at)) : dtLocalVal(kind === 'in' ? shiftStartDate(s) : shiftEndDate(s));

/* ---------- send roster ---------- */
/* the client-side message: every shift for the client in the range, grouped by
   day, worker first names only. Copy for WhatsApp, or open WhatsApp / email. */
function clientRosterMsg(c, from, to){
  var days = rosterDays();
  var out = [];
  days.forEach(function(d){
    var todays = state.data.shifts.filter(function(s){ return s.client_id === c.id && s.date === d; })
      .sort(function(a, b){ return tMin(a.start_t) - tMin(b.start_t); });
    if (!todays.length) { out.push(fmtDate(d) + ': no shift'); return; }
    todays.forEach(function(s){
      var w = s.worker_id ? workerById(s.worker_id) : null;
      out.push(fmtDate(d) + ': ' + fmtRange(s.start_t, s.end_t) + (s.type === 'sleepover' ? ' (sleepover)' : '') + ' \u2013 ' + (w ? firstName(w.name) : 'worker to be confirmed'));
    });
  });
  var who = c.contact_name ? firstName(c.contact_name) : firstName(c.name);
  return 'Hi ' + who + ', here is ' + firstName(c.name) + '\u2019s support roster for ' + fmtDate(from) + ' \u2013 ' + fmtDate(to) + ':\n\n' + out.join('\n') + '\n\nIf anything needs to change, please let the office know.\n\nAstar Health Service';
}
function copyText(txt, btn){
  function done(){ if (btn) { btn.textContent = 'Copied \u2713'; setTimeout(function(){ btn.textContent = 'Copy'; }, 1800); } toast('Copied \u2014 paste it into WhatsApp or a message'); }
  function fallback(){
    var ta = document.createElement('textarea'); ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    try { document.execCommand('copy'); done(); } catch (e) { toast('Could not copy \u2014 long-press the text to select it', true); }
    document.body.removeChild(ta);
  }
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done)["catch"](fallback);
  else fallback();
}
function waHref(phone, msg){
  var digits = (phone || '').replace(/\D/g, '');
  if (digits.length === 10 && digits.charAt(0) === '0') digits = '61' + digits.slice(1); // 04xx xxx xxx -> 614xx
  return 'https://wa.me/' + digits + '?text=' + encodeURIComponent(msg);
}

/* ================= admin: pay ================= */
function fortStart(anchorLike){
  var anchor = state.data.settings.fortnight_anchor || mondayOf(todayYmd());
  var base = state.pay.anchor || (function(){
    var t = mondayOf(todayYmd());
    var diff = Math.round((pd(t) - pd(anchor)) / 86400000);
    var k = Math.floor(diff / 14);
    return addDays(anchor, k * 14);
  })();
  return base;
}
/* pay for one shift on a flat-priced client, AS ROSTERED (owner rule 2026-09-05): each
   rostered hour is paid at the rate of the PERIOD it falls in — the client's shift types
   define the periods (Tim: day 09:00–18:00 = $250 ÷ 9 h, sleepover 18:00–09:00 = $150 ÷ 15 h).
   A standard-length shift therefore pays its flat amount; a sleepover that runs to noon earns
   the morning at the day rate; a day shift that starts late loses those hours. Hourly clients
   (no flat_pay on their shift types) return flat:false for the caller. */
function shiftPay(s){
  var rq = state.data.reqs.find(function(x){ return x.id === s.req_id; });
  if (!rq || rq.flat_pay == null || rq.flat_pay === '') return { flat: false };
  var periods = state.data.reqs.filter(function(x){ return x.client_id === s.client_id && x.flat_pay != null && x.flat_pay !== '' && x.active !== false; })
    .map(function(x){ return { a: tMin(x.start_t), b: tMin(x.end_t), perMin: (+x.flat_pay || 0) / ((shiftHours(x) || 1) * 60) }; });
  function inWin(p, t){ return p.b > p.a ? (t >= p.a && t < p.b) : (t >= p.a || t < p.b); }
  var own = (+rq.flat_pay || 0) / ((shiftHours(rq) || 1) * 60);
  var start = tMin(s.start_t), mins = Math.round(shiftHours(s) * 60), amt = 0, step = 15;
  for (var m = 0; m < mins; m += step) {
    var t = (start + m) % 1440, n = Math.min(step, mins - m);
    var p = periods.find(function(x){ return inWin(x, t); });
    amt += (p ? p.perMin : own) * n;
  }
  var flat = +rq.flat_pay || 0, stdH = shiftHours(rq) || 1, h = shiftHours(s);
  amt = Math.round(amt * 100) / 100;
  return { flat: true, base: amt, hours: h, extraH: Math.round((h - stdH) * 100) / 100, extra: Math.round((amt - flat) * 100) / 100, hourly: flat / stdH };
}
function moneySigned(n){ return (n < 0 ? '−' : (n > 0 ? '+' : '')) + money(Math.abs(n)); }

/* the pay period: fortnight (pay cycle, default) / week / calendar month / custom dates */
function payRange(){
  var P = state.pay;
  if (P.mode === 'week') { var wk = P.wk || (P.wk = mondayOf(todayYmd())); return { from: wk, to: addDays(wk, 6), label: 'Week ' + fmtDate(wk) + ' – ' + fmtDate(addDays(wk, 6)) }; }
  if (P.mode === 'month') {
    var mo = P.mo || (P.mo = todayYmd().slice(0, 7) + '-01');
    var d = pd(mo); var last = new Date(d.getFullYear(), d.getMonth() + 1, 0);
    return { from: mo, to: ymd(last), label: MON[d.getMonth()] + ' ' + d.getFullYear() };
  }
  if (P.mode === 'custom') {
    if (!P.from || !P.to) { var f0 = fortStart(); P.from = P.from || f0; P.to = P.to || addDays(f0, 13); }
    var a = P.from <= P.to ? P.from : P.to, b = P.from <= P.to ? P.to : P.from;
    return { from: a, to: b, label: fmtDate(a) + ' – ' + fmtDate(b) };
  }
  var fs = fortStart(); P.anchor = fs;
  return { from: fs, to: addDays(fs, 13), label: 'Fortnight ' + fmtDate(fs) + ' – ' + fmtDate(addDays(fs, 13)) };
}
function payStep(dir){
  var P = state.pay;
  if (P.mode === 'week') P.wk = addDays(P.wk, 7 * dir);
  else if (P.mode === 'month') { var d = pd(P.mo); d.setMonth(d.getMonth() + dir); P.mo = ymd(d).slice(0, 7) + '-01'; }
  else if (P.mode === 'custom') { var span = Math.round((pd(P.to) - pd(P.from)) / 86400000) + 1; P.from = addDays(P.from, span * dir); P.to = addDays(P.to, span * dir); }
  else P.anchor = addDays(fortStart(), 14 * dir);
  render();
  var r = payRange(); ensureWindow(dir < 0 ? r.from : r.to);
}

/* ================= boot ================= */
/* only re-render on WIDTH change — mobile keyboards fire height-only resizes
   that would otherwise wipe in-progress input */
window.addEventListener('resize', (function(){
  var t, lastW = window.innerWidth;
  return function(){
    clearTimeout(t);
    t = setTimeout(function(){
      if (window.innerWidth === lastW) return;
      lastW = window.innerWidth;
      if (state.auth && !state.loading) render();
    }, 180);
  };
})());

(function boot(){
  var saved = loadSession();
  // only restore a session that belongs to THIS portal and can renew itself
  // (token + refresh) — anything older gets a clean sign-in instead of a
  // dead "JWT expired" screen
  if (saved && saved.token && saved.refresh && ((PORTAL === 'admin' && saved.mode === 'admin') || (PORTAL === 'worker' && saved.mode === 'worker'))) {
    state.auth = saved;
  } else {
    clearSession();
  }
  render();
  if (state.auth) loadAll().then(render);
})();

function evLabel(text){ return el('label', { style: 'display:block;font-size:14px;font-weight:600;color:var(--ink);margin:0 0 6px' }, text); }

function evText(f, key, label, help, long){

  ]);
}
function evNumVal(v){ var n = parseFloat(v); return isNaN(n) ? 0 : n; }
function evIntVal(v){ var n = parseInt(v, 10); return isNaN(n) ? 0 : n; }
/* blank stays blank: a field the worker did not answer is stored as null ("not recorded"), never as 0 */
function evIntOrNull(v){ if (v === '' || v == null) return null; var n = parseInt(v, 10); return isNaN(n) ? null : n; }
function evNumOrNull(v){ if (v === '' || v == null) return null; var n = parseFloat(v); return isNaN(n) ? null : n; }
/* until migration 002 is applied the database still rejects null counts; fall back to 0 and say so */
function evSaveWithNullFallback(doSave, rec, zeroKeys){
  return doSave(rec)["catch"](function(e){
    if (!/null value|not-null|23502/i.test(e.message || '')) throw e;
    var rec2 = {}; Object.keys(rec).forEach(function(k){ rec2[k] = rec[k]; });
    var blanked = [];
    zeroKeys.forEach(function(k){ if (rec2[k] === null) { rec2[k] = 0; blanked.push(k); } });
    return doSave(rec2).then(function(r){
      if (blanked.length) toast('Saved. Blank answers were stored as 0 because the database update that allows "not recorded" is still pending.', true);
      return r;
    });
  });
}

/* Chart colours are validated (colour-vision safe, chroma floor, contrast):
   teal = accent series, red = falls / over allowance, amber = near misses, grey = asleep. */
var RP_C = { acc: '#0f9b8a', bad: '#c92f2f', warn: '#b8860b', dim: '#cfcac0', grid: '#e7e4de', axis: '#8a919b', ink: '#14181d' };

function rpSec(n, title, lead, kids, cls){

    ])
  ].concat(kids || []));
}
function rpEmpty(text, hint){ return el('div', { 'class': 'rp-empty' }, [ el('b', null, text), hint ? el('div', null, hint) : null ]); }
function rpTile(label, value, ctx){ return el('div', { 'class': 'rp-kpi' }, [ el('div', { 'class': 'l' }, label), el('div', { 'class': 'v' }, value), el('div', { 'class': 'c' }, ctx || '') ]); }
function rpLegend(items){
  return el('div', { 'class': 'rp-legend' }, items.map(function(it){ return el('span', null, [ el('i', { style: 'background:' + it.c }), it.l ]); }));
}
function rpSub(text){ return el('div', { 'class': 'rp-sub' }, text); }
function rpTable(head, rows){
  return el('div', { 'class': 'rp-tbl-wrap' }, el('table', { 'class': 'rp-tbl' }, [
    el('thead', null, el('tr', null, head.map(function(h){ return el('th', { 'class': h.n ? 'n' : '', scope: 'col' }, h.t || h); }))),
    el('tbody', null, rows.map(function(r){
      return el('tr', null, r.map(function(c){
        if (c && typeof c === 'object' && !c.nodeType) return el('td', { 'class': (c.n ? 'n' : '') + (c.m ? ' m' : '') }, c.t);
        return el('td', null, c == null ? '' : c);
      }));
    }))
  ]));
}
function svgNode(tag, attrs, kids){
  var n = document.createElementNS('http://www.w3.org/2000/svg', tag);
  Object.keys(attrs || {}).forEach(function(k){ n.setAttribute(k, attrs[k]); });
  (kids || []).forEach(function(k){ if (k) n.appendChild(k); });
  return n;
}
function svgText(x, y, txt, attrs){
  var a = { x: x, y: y, 'font-size': 11, fill: RP_C.axis };
  Object.keys(attrs || {}).forEach(function(k){ a[k] = attrs[k]; });
  var t = svgNode('text', a); t.textContent = txt; return t;
}
function svgTitle(node, txt){ var t = svgNode('title'); t.textContent = txt; node.appendChild(t); return node; }
function roundTopPath(x, y, w, h, r){
  r = Math.min(r, w / 2, h);
  return 'M' + x + ',' + (y + h) + ' L' + x + ',' + (y + r) + ' Q' + x + ',' + y + ' ' + (x + r) + ',' + y +
    ' L' + (x + w - r) + ',' + y + ' Q' + (x + w) + ',' + y + ' ' + (x + w) + ',' + (y + r) + ' L' + (x + w) + ',' + (y + h) + ' Z';
}
function rpNiceMax(v){
  if (v <= 4) return 4;
  if (v <= 8) return 8;
  var p = Math.pow(10, Math.floor(Math.log(v) / Math.LN10)), f = v / p;
  return (f <= 2 ? 2 : (f <= 5 ? 5 : 10)) * p;
}
function pct(n, d){ return d ? Math.round(n / d * 100) + '%' : '—'; }
function avg(arr){ return arr.length ? arr.reduce(function(a, b){ return a + b; }, 0) / arr.length : 0; }
function sum(arr){ return arr.reduce(function(a, b){ return a + b; }, 0); }

/* Column chart (grouped or stacked). groups: [{label, vals:[...]}]; series: [{name, color}].
   opts: stacked, yMax, unit ('h' or ''), ref {v, label}, capLabel(group) -> text|null, height */
function rpColumns(groups, series, opts){
  opts = opts || {};
  var n = groups.length, W = 720, H = opts.height || 210, padL = 38, padR = 14, top = 22, bottom = 28;
  var plotW = W - padL - padR, plotH = H - top - bottom;
  var maxV = 0;
  groups.forEach(function(g){ var t = opts.stacked ? sum(g.vals) : Math.max.apply(null, g.vals); if (t > maxV) maxV = t; });
  var yMax = opts.yMax || rpNiceMax(maxV || 1), step = yMax / 4;
  var svg = svgNode('svg', { viewBox: '0 0 ' + W + ' ' + H, width: '100%', 'class': 'rp-svg', role: 'img' });
  function yOf(v){ return top + plotH - v / yMax * plotH; }
  for (var i = 0; i <= 4; i++) {
    var v = step * i, y = yOf(v);
    svg.appendChild(svgNode('line', { x1: padL, x2: W - padR, y1: y, y2: y, stroke: i === 0 ? RP_C.axis : RP_C.grid, 'stroke-width': 1 }));
    var tick = (Math.round(v * 100) / 100) + (opts.unit === 'h' ? ' h' : '');
    if (opts.unit === 'h' || v === Math.round(v)) svg.appendChild(svgText(padL - 8, y + 4, tick, { 'text-anchor': 'end' }));
  }
  var slot = plotW / n, k = opts.stacked ? 1 : series.length;
  var bw = Math.min(24, Math.max(5, (slot - 10) / k - 2));
  var groupW = k * bw + (k - 1) * 2;
  var every = n <= 14 ? 1 : Math.ceil(n / 14);
  groups.forEach(function(g, gi){
    var x0 = padL + gi * slot + (slot - groupW) / 2, base = top + plotH, topY = base;
    if (opts.stacked) {
      var acc = 0, topIdx = -1;
      g.vals.forEach(function(v, si){ if (v > 0) topIdx = si; });
      g.vals.forEach(function(v, si){
        if (!(v > 0)) return;
        var y1 = yOf(acc + v), y0 = yOf(acc), h = y0 - y1;
        var gap = si === topIdx ? 0 : 2; /* 2px surface gap between stacked segments */
        var node = si === topIdx
          ? svgNode('path', { d: roundTopPath(x0, y1, bw, h, 4), fill: series[si].color })
          : svgNode('rect', { x: x0, y: y1 + gap, width: bw, height: Math.max(0, h - gap), fill: series[si].color });
        svgTitle(node, g.label + ' · ' + series[si].name + ': ' + (Math.round(v * 100) / 100) + (opts.unit === 'h' ? ' h' : ''));
        svg.appendChild(node);
        acc += v; topY = y1;
      });
    } else {
      g.vals.forEach(function(v, si){
        var x = x0 + si * (bw + 2);
        if (!(v > 0)) return;
        var y1 = yOf(v), h = base - y1;
        var node = svgNode('path', { d: roundTopPath(x, y1, bw, h, 4), fill: series[si].color });
        svgTitle(node, g.label + ' · ' + series[si].name + ': ' + v);
        svg.appendChild(node);
        if (y1 < topY) topY = y1;
      });
    }
    var cap = opts.capLabel ? opts.capLabel(g, gi) : null;
    if (cap) svg.appendChild(svgText(x0 + groupW / 2, topY - 7, cap, { 'text-anchor': 'middle', fill: RP_C.ink, 'font-weight': 600 }));
    if (gi % every === 0) svg.appendChild(svgText(x0 + groupW / 2, H - 9, g.label, { 'text-anchor': 'middle' }));
  });
  if (opts.ref) {
    var ry = yOf(opts.ref.v);
    svg.appendChild(svgNode('line', { x1: padL, x2: W - padR, y1: ry, y2: ry, stroke: RP_C.bad, 'stroke-width': 1.5 }));
    svg.appendChild(svgText(W - padR, ry - 6, opts.ref.label, { 'text-anchor': 'end', fill: RP_C.bad, 'font-weight': 600 }));
  }
  return el('div', { 'class': 'rp-fig' }, svg);
}

/* Horizontal stacked bars: rows [{l, segs:[{v, c, name}]}] */
function rpHBars(rows){
  var max = Math.max.apply(null, rows.map(function(r){ return sum(r.segs.map(function(s){ return s.v; })); })) || 1;
  return el('div', { 'class': 'rp-fig' }, rows.map(function(r){

function sumNightChart(rows){

  for (var g = 0; g <= 8; g += 2) { var y = yOf(g); svg.appendChild(svgNode('line', { x1: padL, x2: W - padR, y1: y, y2: y, stroke: g === 0 ? RP_C.axis : RP_C.grid, 'stroke-width': 1 })); svg.appendChild(svgText(padL - 8, y + 4, g + ' h', { 'text-anchor': 'end' })); }

      svgTitle(box, sumFmtNight(r) + ': ' + (r.status === 'missing' ? 'no overnight summary recorded' : 'summary without sleep-log hours')); svg.appendChild(box);
      if (slot >= 44) svg.appendChild(svgText(x + bw / 2, yOf(1) - 6, r.status === 'missing' ? 'no record' : 'partial', { 'text-anchor': 'middle', 'font-size': 9 }));

      if (within > 0) { var a = svgNode(over > 0 ? 'rect' : 'path', over > 0 ? { x: x, y: yOf(within) + 2, width: bw, height: base - yOf(within) - 2, fill: RP_C.acc } : { d: roundTopPath(x, yOf(within), bw, base - yOf(within), 4), fill: RP_C.acc }); svgTitle(a, sumFmtNight(r) + ': ' + hrsFmt(r.active) + ' h direct assistance'); svg.appendChild(a); }

  });
  var ry = yOf(EV_SLEEPOVER_INCLUDED_HOURS);
  svg.appendChild(svgNode('line', { x1: padL, x2: W - padR, y1: ry, y2: ry, stroke: RP_C.bad, 'stroke-width': 1.5 }));
  svg.appendChild(svgText(padL + 4, ry - 6, '2 h included in the sleepover price (NDIS PAPL)', { 'text-anchor': 'start', fill: RP_C.bad, 'font-weight': 600 }));
  svg.appendChild(svgText(padL, H - 3, 'Bars = direct worker assistance inside 11pm–7am · n = ' + rows.filter(function(r){ return r.status === 'documented'; }).length + ' documented of ' + rows.length + ' rostered · dashed = no record', { 'font-size': 10 }));
  return el('div', { 'class': 'rp-fig' }, svg);
}

  ].forEach(function(r){ t.appendChild(el('tr', null, [ el('td', null, r[0]), el('td', { 'class': 'n' }, String(r[1])) ])); });
  box.appendChild(t);
  return box;
}
function exportOvernight(l){
  var a = evNumVal(l.asleep_hours), x = evNumVal(l.active_hours);
  var box = el('div', { 'class': 'xp-rec xp-on' }, [ el('div', { 'class': 'xp-rec-h' }, 'Overnight summary · 11:00pm to 7:00am block') ]);
  var t = el('table', { 'class': 'xp-tbl xp-tbl-sm' });
  [['Went to bed at', l.bed_time ? fmtTime(l.bed_time) : '—'], ['Up for the day at', l.wake_time ? fmtTime(l.wake_time) : '—'],
   ['Times woke needing support before being up for the day', l.wakes],
   ['Hours asleep in the block', hrsFmt(a) + ' h'], ['Hours of active support in the block', hrsFmt(x) + ' h'],
   ['Active support above the 2-hour sleepover allowance', hrsFmt(Math.max(0, x - 2)) + ' h']
  ].forEach(function(r){ t.appendChild(el('tr', null, [ el('td', null, r[0]), el('td', { 'class': 'n' }, String(r[1])) ])); });
  box.appendChild(t);
  return box;
}
