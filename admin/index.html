    el('span', null, [ el('i', { style: 'background:var(--bad-soft);border:1px dashed #E3B1AB' }), 'Needs cover' ]),
    el('span', null, [ el('i', { style: 'background:var(--warn-soft);border:1px solid #E7D6AE' }), 'Clash — this worker is double-booked' ]),
    el('span', null, '☾ sleepover · "part" = a split slot')
  ]);
}
function rosterChip(s, row, d){

    return el('button', { 'class': 'rw-chip gap', onclick: function(e){ gapCreateShift(row, d, e.currentTarget); } }, [

    var partLbl = parts.length > 1 ? ' · part ' + (parts.indexOf(s) + 1) + ' of ' + parts.length : '';
    var title = kind === 'clash' ? 'Clash — ' + w.name + ' has another shift overlapping this time' : '';
    return el('button', { 'class': 'rw-chip ' + (kind === 'clash' ? 'clash' : 'cov'), title: title, 'aria-label': w.name + ' ' + fmtRange(s.start_t, s.end_t) + (title ? '. ' + title : ''), onclick: function(){ openAdminShift(s); } }, [

/* ---------- assign a worker ---------- */
function workerAvailFor(w, date){
  var wk = mondayOf(date);
  var a = state.data.avail.find(function(x){ return x.worker_id === w.id && x.week_start === wk; });
  if (!a || !a.days) return null;                 // not submitted
  return !!a.days[String(dow(date))];
}
function overlaps(s1, s2){
  var a1 = shiftStartDate(s1).getTime(), b1 = shiftEndDate(s1).getTime();
  var a2 = shiftStartDate(s2).getTime(), b2 = shiftEndDate(s2).getTime();
  return a1 < b2 && a2 < b1;
}
function doubleBooked(w, s){
  return state.data.shifts.some(function(o){
    return o.id !== s.id && o.worker_id === w.id && Math.abs(pd(o.date) - pd(s.date)) <= 86400000 * 1.5 && overlaps(o, s);
  });
}

function openAssign(s){
  var c = clientById(s.client_id);
  var cands = state.data.workers.filter(function(w){ return !w.is_admin && w.active; }).map(function(w){
    var avail = workerAvailFor(w, s.date);
    var busy = doubleBooked(w, s);
    return { w: w, avail: avail, busy: busy, rank: busy ? 2 : (avail === true ? 0 : (avail === null ? 1 : 3)) };
  }).sort(function(a,b){ return a.rank - b.rank || (a.w.name < b.w.name ? -1 : 1); });

  var m = el('div', { 'class': 'modal', style: 'max-width:460px' }, [

/* the shifts that hand over to / from this one on the same client: prev ends exactly when
   this starts, next starts exactly when this ends (works across midnight via shift dates) */
function rosterNeighbours(s){
  var st = shiftStartDate(s).getTime(), en = shiftEndDate(s).getTime();
  var prev = null, next = null;
  state.data.shifts.forEach(function(o){
    if (o.id === s.id || o.client_id !== s.client_id) return;
    if (shiftEndDate(o).getTime() === st) prev = o;
    if (shiftStartDate(o).getTime() === en) next = o;
  });
  return { prev: prev, next: next };
}

/* ---------- send roster ---------- */
/* the client-side message: every shift for the client in the range, grouped by
   day, worker first names only. Copy for WhatsApp, or open WhatsApp / email. */
function clientRosterMsg(c, from, to){
  var days = rosterDays();
  var out = [];
  days.forEach(function(d){
    var todays = state.data.shifts.filter(function(s){ return s.client_id === c.id && s.date === d; })
      .sort(function(a, b){ return tMin(a.start_t) - tMin(b.start_t); });
    if (!todays.length) { out.push(fmtDate(d) + ': no shift'); return; }
    todays.forEach(function(s){
      var w = s.worker_id ? workerById(s.worker_id) : null;
      out.push(fmtDate(d) + ': ' + fmtRange(s.start_t, s.end_t) + (s.type === 'sleepover' ? ' (sleepover)' : '') + ' \u2013 ' + (w ? firstName(w.name) : 'worker to be confirmed'));
    });
  });
  var who = c.contact_name ? firstName(c.contact_name) : firstName(c.name);
  return 'Hi ' + who + ', here is ' + firstName(c.name) + '\u2019s support roster for ' + fmtDate(from) + ' \u2013 ' + fmtDate(to) + ':\n\n' + out.join('\n') + '\n\nIf anything needs to change, please let the office know.\n\nAstar Health Service';
}
function copyText(txt, btn){
  function done(){ if (btn) { btn.textContent = 'Copied \u2713'; setTimeout(function(){ btn.textContent = 'Copy'; }, 1800); } toast('Copied \u2014 paste it into WhatsApp or a message'); }
  function fallback(){
    var ta = document.createElement('textarea'); ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    try { document.execCommand('copy'); done(); } catch (e) { toast('Could not copy \u2014 long-press the text to select it', true); }
    document.body.removeChild(ta);
  }
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done)["catch"](fallback);
  else fallback();
}
function waHref(phone, msg){
  var digits = (phone || '').replace(/\D/g, '');
  if (digits.length === 10 && digits.charAt(0) === '0') digits = '61' + digits.slice(1); // 04xx xxx xxx -> 614xx
  return 'https://wa.me/' + digits + '?text=' + encodeURIComponent(msg);
}

/* ================= admin: pay ================= */
function fortStart(anchorLike){
  var anchor = state.data.settings.fortnight_anchor || mondayOf(todayYmd());
  var base = state.pay.anchor || (function(){
    var t = mondayOf(todayYmd());
    var diff = Math.round((pd(t) - pd(anchor)) / 86400000);
    var k = Math.floor(diff / 14);
    return addDays(anchor, k * 14);
  })();
  return base;
}
/* pay for one shift on a flat-priced client, AS ROSTERED (owner rule 2026-09-05): each
   rostered hour is paid at the rate of the PERIOD it falls in — the client's shift types
   define the periods (Tim: day 09:00–18:00 = $250 ÷ 9 h, sleepover 18:00–09:00 = $150 ÷ 15 h).
   A standard-length shift therefore pays its flat amount; a sleepover that runs to noon earns
   the morning at the day rate; a day shift that starts late loses those hours. Hourly clients
   (no flat_pay on their shift types) return flat:false for the caller. */
function shiftPay(s){
  var rq = state.data.reqs.find(function(x){ return x.id === s.req_id; });
  if (!rq || rq.flat_pay == null || rq.flat_pay === '') return { flat: false };
  var periods = state.data.reqs.filter(function(x){ return x.client_id === s.client_id && x.flat_pay != null && x.flat_pay !== '' && x.active !== false; })
    .map(function(x){ return { a: tMin(x.start_t), b: tMin(x.end_t), perMin: (+x.flat_pay || 0) / ((shiftHours(x) || 1) * 60) }; });
  function inWin(p, t){ return p.b > p.a ? (t >= p.a && t < p.b) : (t >= p.a || t < p.b); }
  var own = (+rq.flat_pay || 0) / ((shiftHours(rq) || 1) * 60);
  var start = tMin(s.start_t), mins = Math.round(shiftHours(s) * 60), amt = 0, step = 15;
  for (var m = 0; m < mins; m += step) {
    var t = (start + m) % 1440, n = Math.min(step, mins - m);
    var p = periods.find(function(x){ return inWin(x, t); });
    amt += (p ? p.perMin : own) * n;
  }
  var flat = +rq.flat_pay || 0, stdH = shiftHours(rq) || 1, h = shiftHours(s);
  amt = Math.round(amt * 100) / 100;
  return { flat: true, base: amt, hours: h, extraH: Math.round((h - stdH) * 100) / 100, extra: Math.round((amt - flat) * 100) / 100, hourly: flat / stdH };
}
function moneySigned(n){ return (n < 0 ? '−' : (n > 0 ? '+' : '')) + money(Math.abs(n)); }

/* the pay period: fortnight (pay cycle, default) / week / calendar month / custom dates */
function payRange(){
  var P = state.pay;
  if (P.mode === 'week') { var wk = P.wk || (P.wk = mondayOf(todayYmd())); return { from: wk, to: addDays(wk, 6), label: 'Week ' + fmtDate(wk) + ' – ' + fmtDate(addDays(wk, 6)) }; }
  if (P.mode === 'month') {
    var mo = P.mo || (P.mo = todayYmd().slice(0, 7) + '-01');
    var d = pd(mo); var last = new Date(d.getFullYear(), d.getMonth() + 1, 0);
    return { from: mo, to: ymd(last), label: MON[d.getMonth()] + ' ' + d.getFullYear() };
  }
  if (P.mode === 'custom') {
    if (!P.from || !P.to) { var f0 = fortStart(); P.from = P.from || f0; P.to = P.to || addDays(f0, 13); }
    var a = P.from <= P.to ? P.from : P.to, b = P.from <= P.to ? P.to : P.from;
    return { from: a, to: b, label: fmtDate(a) + ' – ' + fmtDate(b) };
  }
  var fs = fortStart(); P.anchor = fs;
  return { from: fs, to: addDays(fs, 13), label: 'Fortnight ' + fmtDate(fs) + ' – ' + fmtDate(addDays(fs, 13)) };
}
function payStep(dir){
  var P = state.pay;
  if (P.mode === 'week') P.wk = addDays(P.wk, 7 * dir);
  else if (P.mode === 'month') { var d = pd(P.mo); d.setMonth(d.getMonth() + dir); P.mo = ymd(d).slice(0, 7) + '-01'; }
  else if (P.mode === 'custom') { var span = Math.round((pd(P.to) - pd(P.from)) / 86400000) + 1; P.from = addDays(P.from, span * dir); P.to = addDays(P.to, span * dir); }
  else P.anchor = addDays(fortStart(), 14 * dir);
  render();
  var r = payRange(); ensureWindow(dir < 0 ? r.from : r.to);
}

  function inScope(s){ return s.date >= fs && s.date <= fe && (!onlyClient || s.client_id === onlyClient.id); }

  var grand = 0, grandN = 0, grandBox = el('div');

    mine.forEach(function(s){
      var p = shiftPay(s);
      if (p.flat) { flatN++; flatH += p.hours; flatAmt += p.base; extraH += p.extraH; extraAmt += p.extra; return; }
      var d = dow(s.date), h = shiftHours(s);
      if (d === 6) hSat += h; else if (d === 0) hSun += h; else hWd += h;
    });
    state.data.notes.forEach(function(n){
      if (n.worker_id !== w.id || n.note_type !== 'Mileage' || !n.shift_id) return;
      var s = shiftById(n.shift_id);
      if (!s || !inScope(s)) return;
      var re = /(\d+(?:\.\d+)?)\s*km/ig, mkm;
      while ((mkm = re.exec(n.body || ''))) kmSum += parseFloat(mkm[1]);
    });
    var r = w.rates || {};
    var kmRate = +(state.data.settings.km_rate || 0);
    var total = hWd * (+r.weekday || 0) + hSat * (+r.saturday || 0) + hSun * (+r.sunday || 0) + flatAmt + kmSum * kmRate;
    var inv = state.data.invoices.find(function(x){ return x.worker_id === w.id && x.fort_start === fs; });
    grand += total; grandN += mine.length;

    var card = el('div', { 'class': 'card card-pad', style: 'margin-top:14px' + (onlyClient ? ';border-left:4px solid ' + onlyClient.colour : '') });
    card.appendChild(el('div', { style: 'display:flex;align-items:center;gap:12px;margin-bottom:12px' }, [
      el('span', { 'class': 'avatar', style: 'background:' + w.colour }, initials(w.name)),
      el('div', { style: 'flex:1' }, [ el('b', null, w.name), el('div', { 'class': 't-cap' }, mine.length + ' shift' + (mine.length === 1 ? '' : 's') + (onlyClient ? ' with ' + onlyClient.name : '') + ' this period') ]),
      el('div', { 'class': 't-title t-num' }, money(total))
    ]));
    var grid = el('div', { style: 'display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px' });
    [['Weekday', hrsFmt(hWd) + ' h', money(hWd * (+r.weekday || 0))],
     ['Saturday', hrsFmt(hSat) + ' h', money(hSat * (+r.saturday || 0))],
     hSun ? ['Sunday', hrsFmt(hSun) + ' h', money(hSun * (+r.sunday || 0))] : null,
     ['Flat shifts', flatN + (flatN ? ' · ' + hrsFmt(flatH) + ' h' : ''), money(flatAmt)],
     ['Over / under standard', (extraH > 0 ? '+' : (extraH < 0 ? '−' : '')) + hrsFmt(Math.abs(extraH)) + ' h', moneySigned(extraAmt)],
     ['Kilometres', hrsFmt(kmSum) + ' km', money(kmSum * kmRate)]
    ].filter(Boolean).forEach(function(p){
      grid.appendChild(el('div', { style: 'background:var(--paper);border-radius:10px;padding:9px 12px' }, [
        el('div', { 'class': 't-cap' }, p[0]),
        el('b', { 'class': 't-num', style: 'font-size:14px' }, p[1]),
        el('div', { 'class': 't-cap t-num' }, p[2])
      ]));
    });
    card.appendChild(grid);
    if (P.mode === 'fortnight' && !onlyClient) card.appendChild(el('label', { 'class': 'checkrow', style: 'margin-top:10px' }, [
      el('input', { type: 'checkbox', checked: !!(inv && inv.received), onchange: function(e){
        sbUpsert('ac_invoices', [{ worker_id: w.id, fort_start: fs, received: e.target.checked }], 'worker_id,fort_start')
          .then(function(){ toast(e.target.checked ? 'Invoice marked received' : 'Invoice unmarked'); refresh(); })
          ["catch"](function(err){ toast(err.message, true); });
      } }),
      el('span', { style: 'font-size:14px' }, 'Invoice received for this fortnight')
    ]));
    main.appendChild(card);
  });
  if (workers.length) grandBox.appendChild(el('div', { 'class': 'card card-pad', style: 'display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--paper)' }, [
    el('div', { style: 'flex:1' }, [ el('b', null, 'Total for ' + (onlyClient ? onlyClient.name : 'all clients')), el('div', { 'class': 't-cap' }, grandN + ' shift' + (grandN === 1 ? '' : 's') + ' · ' + workers.length + ' worker' + (workers.length === 1 ? '' : 's') + ' · ' + R.label) ]),
    el('div', { 'class': 't-title t-num' }, money(grand))
  ]));
}

/* ================= boot ================= */
/* only re-render on WIDTH change — mobile keyboards fire height-only resizes
   that would otherwise wipe in-progress input */
window.addEventListener('resize', (function(){
  var t, lastW = window.innerWidth;
  return function(){
    clearTimeout(t);
    t = setTimeout(function(){
      if (window.innerWidth === lastW) return;
      lastW = window.innerWidth;
      if (state.auth && !state.loading) render();
    }, 180);
  };
})());

(function boot(){
  var saved = loadSession();
  // only restore a session that belongs to THIS portal and can renew itself
  // (token + refresh) — anything older gets a clean sign-in instead of a
  // dead "JWT expired" screen
  if (saved && saved.token && saved.refresh && ((PORTAL === 'admin' && saved.mode === 'admin') || (PORTAL === 'worker' && saved.mode === 'worker'))) {
    state.auth = saved;
  } else {
    clearSession();
  }
  render();
  if (state.auth) loadAll().then(render);
})();
/* ================= evidence logs: near miss, personal care log, overnight summary ================= */
/* These quick structured forms feed the admin Reports tab. Nothing is parsed out of
   the free-text notes — every number on a report comes from a field a worker filled. */
/* Where it happened. Places, not transfer types — whether a transfer was happening is asked
   separately (during_transfer), because a transfer can happen anywhere. The two old
   "X to Y" values are kept so records saved before 2026-09-09 still round-trip in the picker. */
var NM_LOCATIONS = ['Bed', 'Bedroom', 'Bathroom', 'Shower', 'Toilet', 'Lounge or living room',
  'Kitchen', 'Dining area', 'Hallway or doorway', 'Backyard or outside', 'Ramp or steps',
  'Vehicle', 'Community', 'Couch to wheelchair', 'Wheelchair to bed', 'Other'];
/* legacy only: used to guess "transfer-related" for rows saved before during_transfer existed */
var TRANSFER_LOCS = ['Bed', 'Shower', 'Toilet', 'Couch to wheelchair', 'Wheelchair to bed', 'Vehicle'];

/* small form helpers shared by the three modals */
function evLabel(text){ return el('label', { style: 'display:block;font-size:14px;font-weight:600;color:var(--ink);margin:0 0 6px' }, text); }
function evNum(f, key, label, help, opts){
  opts = opts || {};
  return el('div', { 'class': 'field' }, [
    evLabel(label),
    help ? el('div', { 'class': 'q-help', style: 'margin-bottom:6px' }, help) : null,
    el('input', { 'class': 'inp', type: 'number', min: '0', step: opts.step || '1', inputmode: 'decimal', value: f[key] == null ? '' : String(f[key]),
      oninput: function(e){ f[key] = e.target.value; } })
  ]);
}
function evYesNo(f, key, label, onchg){
  return el('div', { 'class': 'field' }, [
    evLabel(label),
    el('div', { style: 'display:flex;gap:18px' }, ['No', 'Yes'].map(function(o){
      return el('label', { 'class': 'radiorow', style: 'margin:0' }, [
        el('input', { type: 'radio', name: 'ev_' + key, checked: f[key] === o, onchange: function(){ f[key] = o; if (onchg) onchg(); } }),
        el('span', { style: 'font-size:14px' }, o)
      ]);
    }))
  ]);
}
function evText(f, key, label, help, long){
  return el('div', { 'class': 'field' }, [
    evLabel(label),
    help ? el('div', { 'class': 'q-help', style: 'margin-bottom:6px' }, help) : null,
    long ? el('textarea', { 'class': 'ta', rows: '3', oninput: function(e){ f[key] = e.target.value; } }, f[key] || '')
         : el('input', { 'class': 'inp', value: f[key] || '', oninput: function(e){ f[key] = e.target.value; } })
  ]);
}
function evNumVal(v){ var n = parseFloat(v); return isNaN(n) ? 0 : n; }
function evIntVal(v){ var n = parseInt(v, 10); return isNaN(n) ? 0 : n; }
/* blank stays blank: a field the worker did not answer is stored as null ("not recorded"), never as 0 */
function evIntOrNull(v){ if (v === '' || v == null) return null; var n = parseInt(v, 10); return isNaN(n) ? null : n; }
function evNumOrNull(v){ if (v === '' || v == null) return null; var n = parseFloat(v); return isNaN(n) ? null : n; }
/* until migration 002 is applied the database still rejects null counts; fall back to 0 and say so */
function evSaveWithNullFallback(doSave, rec, zeroKeys){
  return doSave(rec)["catch"](function(e){
    if (!/null value|not-null|23502/i.test(e.message || '')) throw e;
    var rec2 = {}; Object.keys(rec).forEach(function(k){ rec2[k] = rec[k]; });
    var blanked = [];
    zeroKeys.forEach(function(k){ if (rec2[k] === null) { rec2[k] = 0; blanked.push(k); } });
    return doSave(rec2).then(function(r){
      if (blanked.length) toast('Saved. Blank answers were stored as 0 because the database update that allows "not recorded" is still pending.', true);
      return r;
    });
  });
}

  ['Scope', 'A shift is in scope when its rostered end time has passed. Shifts still running or not yet started are shown separately and never counted as “not recorded”.'],

  ['Counted once', 'A fall or near miss that appears in an incident report and again in a note or document is one event: the structured record is counted; the review links the repeat to it. Reviewed observations with no structured record are counted as their own event. Look-alikes on the same date within 30 minutes are listed for review, not merged.'],
  ['Overnight assistance duration', 'From the overnight summary: the X-coded 15-minute blocks of the paper sleep log inside 23:00–07:00 (elapsed time the worker was assisting). Where a night has no summary but has reviewed observations with start and end times, the merged elapsed time of those intervals is shown and the night is marked partial. Overlapping intervals are merged. Awake-without-assistance is shown only when the whole 23:00–07:00 window is accounted for (asleep + assistance recorded), and the window length is taken from the actual clock times, so a daylight-saving night is 7 or 9 hours, not 8.'],

    ['15. Photos of property damage', ir.property_damage === 'No' ? 'Not applicable' : ((ir.property_photos || []).length ? (ir.property_photos.length + ' photo(s) on file') : 'None attached')],
    ['16. Were emergency services called at all during this incident?', (ir.emergency || []).length ? ir.emergency.join(', ') : 'No'],
    ['17. Were there any injuries?', ir.injuries == null || ir.injuries === '' ? 'Not answered' : (ir.injuries === 'No' ? 'No' : 'Yes')],
    ['18. Who was injured and how did this injury happen?', ir.injuries === 'No' ? 'Not applicable' : ir.injury_who],
    ['19. What kind of injury', ir.injuries === 'No' ? 'Not applicable' : ir.injury_kind]
  );
  rows.forEach(function(r){ box.appendChild(xpRow(r[0], r[1])); });
  return box;
}
function exportNearMiss(nm){
  var yn = function(v){ return v ? 'Yes' : 'No'; };
  var box = el('div', { 'class': 'xp-rec xp-nm' }, [
    el('div', { 'class': 'xp-rec-h' }, 'Near miss · ' + (nm.location || '') + (nm.nm_time ? ' · ' + fmtTime(nm.nm_time) : ''))
  ]);
  [['Recorded by', nm.staff_name], ['Date', nm.nm_date ? fmtDateFull(nm.nm_date) : ''], ['Approximate time', nm.nm_time ? fmtTime(nm.nm_time) : ''],
   ['Where it happened', nm.location === 'Other' && nm.location_other ? 'Other — ' + nm.location_other : nm.location],
   ['Happened during a transfer', nm.during_transfer == null ? 'Not recorded' : yn(nm.during_transfer)],
   ['What nearly happened', nm.description], ['What stopped it becoming a fall', nm.prevented_by],
   ['Equipment contributed', yn(nm.equipment_factor) + (nm.equipment_factor && nm.equipment_desc ? '. ' + nm.equipment_desc : '')]
  ].forEach(function(r){ box.appendChild(xpRow(r[0], r[1])); });
  return box;
}
function exportCareLog(l){
  var box = el('div', { 'class': 'xp-rec xp-care' }, [ el('div', { 'class': 'xp-rec-h' }, 'Personal care log') ]);
  var t = el('table', { 'class': 'xp-tbl xp-tbl-sm' });
  [['Pad changes (wet)', l.pad_wet], ['Pad changes (bowel movement)', l.pad_bowel], ['Times found wet in bed', l.bed_wet], ['Bedding changes', l.bedding_changes],
   ['Shower', l.shower_offered ? (l.shower_done === true ? 'Offered and done' : (l.shower_done === false ? 'Offered and declined' : 'Offered; outcome not recorded')) : 'Not offered this shift'],
   ['Prompts before the shower was accepted', l.shower_offered ? l.shower_prompts : 'n/a'],
   ['Other care refusals needing prompting', l.care_refusals], ['Assisted transfers', l.transfers], ['Transfers one worker could not do safely alone', l.transfer_unsafe_alone]
  ].forEach(function(r){ t.appendChild(el('tr', null, [ el('td', null, r[0]), el('td', { 'class': 'n' }, String(r[1])) ])); });
  box.appendChild(t);
  return box;
}
function exportOvernight(l){
  var a = evNumVal(l.asleep_hours), x = evNumVal(l.active_hours);
  var box = el('div', { 'class': 'xp-rec xp-on' }, [ el('div', { 'class': 'xp-rec-h' }, 'Overnight summary · 11:00pm to 7:00am block') ]);
  var t = el('table', { 'class': 'xp-tbl xp-tbl-sm' });
  [['Went to bed at', l.bed_time ? fmtTime(l.bed_time) : '—'], ['Up for the day at', l.wake_time ? fmtTime(l.wake_time) : '—'],
   ['Times woke needing support before being up for the day (final wake not counted)', l.wakes == null ? 'Not recorded' : l.wakes],
   ['Hours asleep in the block', l.asleep_hours == null ? 'Not recorded' : hrsFmt(a) + ' h'], ['Hours of worker assistance in the block', l.active_hours == null ? 'Not recorded' : hrsFmt(x) + ' h']
  ].forEach(function(r){ t.appendChild(el('tr', null, [ el('td', null, r[0]), el('td', { 'class': 'n' }, String(r[1])) ])); });
  box.appendChild(t);
  return box;
}
